<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ticker }} Stock Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stock.css') }}">
</head>
<body>
    <header>
        <a href="/">Home</a>
    </header>

    <main>
        <h2>{{ ticker }} Stock Analysis</h2>

        {% if error %}
            <p style="color:red;">{{ error }}</p>
        {% else %}
            <div class="recommendation">
                <p>{{ recommendation }}</p>
            </div>
            <div class="chart">
                {{ chart | safe }}
            </div>
        {% endif %}
    </main>

    <footer>
        <p>&copy; ThePulseOfProfit 2025</p>
    </footer>
</body>
</html>
